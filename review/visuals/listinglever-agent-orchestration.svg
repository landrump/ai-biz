<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Listinglever Agent Orchestration Map</title>
  <desc id="desc">A slide-style process flow showing agents, inputs, outputs, statuses, and orchestration for the Listinglever launch system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="46%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f7fbf4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#1c7c54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b2440" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2440" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2457c5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#178a54"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7d8ca3"/>
    </marker>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; fill: #10233f; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; fill: #516178; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; fill: #152a45; }
      .body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; fill: #40506a; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 600; fill: #5d6b82; }
      .micro { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #627089; }
      .white { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #dbe6f4; stroke-width: 2; }
      .ready { fill: #e8f8ef; stroke: #24a160; }
      .work { fill: #fff6db; stroke: #e2a900; }
      .blocked { fill: #ffe8e4; stroke: #df5a43; }
      .draft { fill: #edf2ff; stroke: #617ee8; }
      .lineBlue { fill: none; stroke: #2457c5; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .lineGreen { fill: none; stroke: #178a54; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .lineGray { fill: none; stroke: #7d8ca3; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); stroke-dasharray: 10 12; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1650" cy="140" r="300" fill="#dff3ea" opacity="0.55"/>
  <circle cx="250" cy="920" r="360" fill="#dbeafe" opacity="0.55"/>

  <rect x="70" y="54" width="1780" height="118" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="118" y="105" class="white title" font-size="44">Listinglever Agent Orchestration</text>
  <text x="118" y="146" class="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500">AI business agents turn setup inputs into products, launch assets, traffic, sales, and learning loops</text>
  <rect x="1500" y="82" width="282" height="56" rx="28" fill="#ffffff" opacity="0.18"/>
  <text x="1532" y="118" class="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">Current phase: Launch build</text>

  <!-- Legend -->
  <rect x="70" y="196" width="460" height="64" rx="24" class="card" filter="url(#softShadow)"/>
  <circle cx="112" cy="228" r="11" fill="#24a160"/>
  <text x="132" y="236" class="small" font-size="18">Ready / running</text>
  <circle cx="278" cy="228" r="11" fill="#e2a900"/>
  <text x="298" y="236" class="small" font-size="18">Needs work</text>
  <circle cx="430" cy="228" r="11" fill="#df5a43"/>
  <text x="450" y="236" class="small" font-size="18">Blocked</text>

  <!-- Owner lane -->
  <rect x="70" y="308" width="260" height="558" rx="30" fill="#fefefe" stroke="#ccd8ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="360" class="label" font-size="28">Owner inputs</text>
  <text x="110" y="396" class="body" font-size="18">Accounts, approvals, access</text>

  <rect x="104" y="432" width="192" height="60" rx="18" class="ready"/>
  <text x="128" y="456" class="micro" font-size="16">READY</text>
  <text x="128" y="478" class="body" font-size="18">Domain + email</text>

  <rect x="104" y="512" width="192" height="60" rx="18" class="ready"/>
  <text x="128" y="536" class="micro" font-size="16">READY</text>
  <text x="128" y="558" class="body" font-size="18">Gumroad account</text>

  <rect x="104" y="592" width="192" height="60" rx="18" class="work"/>
  <text x="128" y="616" class="micro" font-size="16">NEEDS WORK</text>
  <text x="128" y="638" class="body" font-size="18">Product shells</text>

  <rect x="104" y="672" width="192" height="60" rx="18" class="work"/>
  <text x="128" y="696" class="micro" font-size="16">NEEDS WORK</text>
  <text x="128" y="718" class="body" font-size="18">Etsy completion</text>

  <rect x="104" y="752" width="192" height="60" rx="18" class="blocked"/>
  <text x="128" y="776" class="micro" font-size="16">BLOCKED</text>
  <text x="128" y="798" class="body" font-size="18">Pinterest account</text>

  <!-- Orchestrator -->
  <rect x="410" y="326" width="312" height="170" rx="32" fill="#ffffff" stroke="#b6c8ea" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="438" y="352" width="92" height="30" rx="15" class="ready"/>
  <text x="458" y="373" class="micro" font-size="14">READY</text>
  <text x="438" y="424" class="label" font-size="28">Official AI Biz Agent</text>
  <text x="438" y="458" class="body" font-size="18">Sets objective, constraints,</text>
  <text x="438" y="482" class="body" font-size="18">decision rules, next work cycle</text>

  <rect x="410" y="574" width="312" height="170" rx="32" fill="#ffffff" stroke="#b6c8ea" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="438" y="600" width="92" height="30" rx="15" class="ready"/>
  <text x="458" y="621" class="micro" font-size="14">READY</text>
  <text x="438" y="672" class="label" font-size="28">Marketing Orchestrator</text>
  <text x="438" y="706" class="body" font-size="18">Routes work across content,</text>
  <text x="438" y="730" class="body" font-size="18">creative, marketplace, email</text>

  <!-- Build lane cards -->
  <rect x="820" y="245" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="848" y="270" width="92" height="30" rx="15" class="ready"/>
  <text x="868" y="291" class="micro" font-size="14">READY</text>
  <text x="848" y="326" class="label" font-size="24">1. Market Intel</text>
  <text x="848" y="356" class="body" font-size="16">Input: niche + constraints</text>
  <text x="848" y="378" class="body" font-size="16">Output: evidence + risks</text>

  <rect x="1210" y="245" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1238" y="270" width="92" height="30" rx="15" class="ready"/>
  <text x="1258" y="291" class="micro" font-size="14">READY</text>
  <text x="1238" y="326" class="label" font-size="24">2. Offer Builder</text>
  <text x="1238" y="356" class="body" font-size="16">Input: evidence + buyer pain</text>
  <text x="1238" y="378" class="body" font-size="16">Output: workflow products</text>

  <rect x="820" y="465" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="848" y="490" width="92" height="30" rx="15" class="ready"/>
  <text x="868" y="511" class="micro" font-size="14">READY</text>
  <text x="848" y="546" class="label" font-size="24">3. Creative Production</text>
  <text x="848" y="576" class="body" font-size="16">Input: product + image specs</text>
  <text x="848" y="598" class="body" font-size="16">Output: prompts + visuals</text>

  <rect x="1210" y="465" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1238" y="490" width="92" height="30" rx="15" class="work"/>
  <text x="1250" y="511" class="micro" font-size="14">NEEDS</text>
  <text x="1238" y="546" class="label" font-size="24">4. Marketplace SEO</text>
  <text x="1238" y="576" class="body" font-size="16">Input: Etsy/Gumroad fields</text>
  <text x="1238" y="598" class="body" font-size="16">Output: listings + tests</text>

  <rect x="820" y="685" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="848" y="710" width="92" height="30" rx="15" class="work"/>
  <text x="860" y="731" class="micro" font-size="14">NEEDS</text>
  <text x="848" y="766" class="label" font-size="24">5. Content Engine</text>
  <text x="848" y="796" class="body" font-size="16">Input: hooks + channels</text>
  <text x="848" y="818" class="body" font-size="16">Output: pins, posts, pages</text>

  <rect x="1210" y="685" width="305" height="150" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1238" y="710" width="92" height="30" rx="15" class="work"/>
  <text x="1250" y="731" class="micro" font-size="14">NEEDS</text>
  <text x="1238" y="766" class="label" font-size="24">6. Email Lifecycle</text>
  <text x="1238" y="796" class="body" font-size="16">Input: subscribers + buyers</text>
  <text x="1238" y="818" class="body" font-size="16">Output: nurture + upsell</text>

  <!-- Launch / learn lane -->
  <rect x="1610" y="335" width="245" height="148" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1636" y="360" width="92" height="30" rx="15" class="blocked"/>
  <text x="1650" y="381" class="micro" font-size="14">BLOCKED</text>
  <text x="1636" y="418" class="label" font-size="23">7. Publish</text>
  <text x="1636" y="448" class="body" font-size="16">Needs product shells,</text>
  <text x="1636" y="470" class="body" font-size="16">files, account access</text>

  <rect x="1610" y="555" width="245" height="148" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1636" y="580" width="92" height="30" rx="15" class="blocked"/>
  <text x="1650" y="601" class="micro" font-size="14">BLOCKED</text>
  <text x="1636" y="638" class="label" font-size="23">8. Measure</text>
  <text x="1636" y="668" class="body" font-size="16">Needs live traffic,</text>
  <text x="1636" y="690" class="body" font-size="16">sales, analytics data</text>

  <rect x="1610" y="775" width="245" height="148" rx="30" class="card" filter="url(#shadow)"/>
  <rect x="1636" y="800" width="92" height="30" rx="15" class="draft"/>
  <text x="1652" y="821" class="micro" font-size="14">DRAFT</text>
  <text x="1636" y="858" class="label" font-size="23">9. Iterate / Scale</text>
  <text x="1636" y="888" class="body" font-size="16">Ads, outreach, partners</text>
  <text x="1636" y="910" class="body" font-size="16">after signal appears</text>

  <!-- Arrows -->
  <path d="M330 590 C360 540, 370 465, 410 430" class="lineBlue"/>
  <path d="M566 496 C566 520, 566 548, 566 574" class="lineGreen"/>
  <path d="M722 412 C760 360, 780 325, 820 320" class="lineBlue"/>
  <path d="M1125 320 C1160 320, 1175 320, 1210 320" class="lineBlue"/>
  <path d="M972 395 C972 425, 972 438, 972 465" class="lineBlue"/>
  <path d="M1125 540 C1160 540, 1175 540, 1210 540" class="lineBlue"/>
  <path d="M972 615 C972 650, 972 662, 972 685" class="lineBlue"/>
  <path d="M1125 760 C1160 760, 1175 760, 1210 760" class="lineBlue"/>
  <path d="M1515 540 C1560 500, 1570 425, 1610 410" class="lineBlue"/>
  <path d="M1732 483 C1732 510, 1732 530, 1732 555" class="lineGray"/>
  <path d="M1732 703 C1732 730, 1732 750, 1732 775" class="lineGray"/>
  <path d="M1610 850 C1440 960, 720 970, 566 744" class="lineGray"/>

  <!-- Bottom status strip -->
  <rect x="70" y="922" width="1440" height="96" rx="28" fill="#ffffff" stroke="#dbe6f4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="108" y="962" class="label" font-size="24">Next unlocks</text>
  <text x="108" y="995" class="body" font-size="19">1) Gumroad product shells  2) Etsy shop/listing completion  3) Pinterest Business  4) AI visual generation  5) Live metrics</text>

  <rect x="1552" y="922" width="303" height="96" rx="28" fill="#10233f" filter="url(#softShadow)"/>
  <text x="1584" y="962" class="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Loop rule</text>
  <text x="1584" y="994" class="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="500">Measure -> Diagnose -> Improve</text>
</svg>
